name: TEMP Showcase Review Smoke Test

# TEMPORARY — delete before merging.
#
# workflow_dispatch only becomes available once a workflow is on the default branch,
# so this exists to prove the secrets and the model leg work while the feature is
# still on a branch. Push-triggered runs on a same-repo branch do receive secrets.
#
# DRY_RUN is hardcoded to 1: this posts nothing to any PR.

on:
  push:
    branches:
      - feat/showcase-pr-auto-review

permissions:
  contents: read
  pull-requests: read

jobs:
  smoke:
    name: Dry-run review of PR 97
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check DEVREL_SKILL_TOKEN can read the rubric
        env:
          DEVREL_SKILL_TOKEN: ${{ secrets.DEVREL_SKILL_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEVREL_SKILL_TOKEN}" ]; then
            echo "::error::DEVREL_SKILL_TOKEN is not set."
            exit 1
          fi
          mkdir -p .review-rubric
          http_code="$(curl -sS -o .review-rubric/SKILL.md -w '%{http_code}' \
            -H "Authorization: Bearer ${DEVREL_SKILL_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/game-by-virtuals/devrel/contents/skills/review-showcase-pr/SKILL.md?ref=main")"
          if [ "${http_code}" != "200" ]; then
            echo "::error::Rubric fetch returned HTTP ${http_code} (404 = token cannot see the repo)."
            exit 1
          fi
          bytes="$(wc -c < .review-rubric/SKILL.md)"
          echo "Rubric fetched OK: ${bytes} bytes"
          # Confirm we got the real rubric, not an error page rendered as text.
          grep -q 'Sound like a person, not a linter' .review-rubric/SKILL.md \
            && echo "Rubric content check: found the tone section (merged devrel#160)." \
            || { echo "::error::Rubric fetched but content unexpected."; exit 1; }

      - name: Dry-run review (posts nothing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-pro
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUBRIC_PATH: .review-rubric/SKILL.md
          BASE_REPO: ${{ github.repository }}
          PR_NUMBERS: '97'
          DRY_RUN: '1'
        run: node scripts/showcase-review/run.mjs
